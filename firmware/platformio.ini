; Desk display firmware.
;
; We do not yet know which board came in the kit, so several candidate envs are
; defined. Build the one matching what tools/identify_board.py reports, then
; delete the rest once the board is confirmed.
;
;   pio run -e esp32dev -t upload && pio device monitor
;
[platformio]
default_envs = esp32dev
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_ENV_NAME=\"$PIOENV\"
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1

; --- classic ESP32-WROOM-32 devkit: by far the most likely kit contents ------
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
; Decode addresses in a crash backtrace into file:line automatically.
monitor_filters = esp32_exception_decoder, time

; --- ESP32-S3 devkit / most 2024+ boards with native USB ---------------------
[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}
    ; Route Serial to the native USB port so the monitor sees the banner.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; --- ESP32-C3 (single-core RISC-V, common in cheap 2-packs) ------------------
[env:esp32-c3-devkitm-1]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- ESP8266 NodeMCU / Wemos D1 mini ----------------------------------------
[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
monitor_filters = esp8266_exception_decoder, time
